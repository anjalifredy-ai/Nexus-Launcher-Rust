[workspace]
resolver = "2"
members = [
    "crates/nexus-core",
    "crates/nexus-download",
    "crates/nexus-versions",
    "crates/nexus-content",
    "crates/nexus-launch",
    "crates/nexus-engine",
    "crates/nexus-ui",
    "crates/nexus-android",
    "crates/nexus-start",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Nexus Team"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha1 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
